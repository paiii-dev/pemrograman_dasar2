<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunga Mawar</title>
    <link rel="stylesheet" href="mawar.css">
</head>
<body>
    <div class="stars"></div>
    <main class="container">
        <p class="subtitle">A little flower</p>
        <h1>Bunga Mawar <span>🌹</span></h1>
        <p class="description">
            Seperti mawar yang mekar, dirimu membawa keindahan yang
            sangat menawan.
        </p>
        <div class="flower-scene">
            <div class="flower" id="flower">
                <div class="petals">
                    <div class="petal petal-1"></div>
                    <div class="petal petal-2"></div>
                    <div class="petal petal-3"></div>
                    <div class="petal petal-4"></div>
                    <div class="petal petal-5"></div>
                    <div class="petal petal-6"></div>
                    <div class="petal petal-7"></div>
                    <div class="petal petal-8"></div>
                    <div class="petal petal-9"></div>
                    <div class="center-petal"></div>
                </div>
                <div class="stem"></div>
                <div class="leaf leaf-left"></div>
                <div class="leaf leaf-right"></div>
            </div>
        </div>
        <button id="bloomButton">Mekarkan Mawar</button>
        <p id="massage">Klik tombol untuk melihat keindahannya.</p>
    </main>
    <script src="mawar.js"></script>
</body>
</html>
